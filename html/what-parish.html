<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="Description" content="Find which parish of the Diocese of Salford a postcode falls in." />
	<meta name="Keywords" content="Diocese of Salford, parish boundaries, what parish, postcode, find my parish, catholic churches" />

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes" />

	<link href="../assets/favicon.png" rel="icon" type="image/png" />

	<link href="../css/style.css" rel="stylesheet" media="screen" />
	<link href="../css/flexnav.css" rel="stylesheet" media="screen" />
	<link href="../css/parish.css" rel="stylesheet" media="screen" />

	<link href="https://fonts.googleapis.com/css?family=Merienda|Arimo" rel="stylesheet">

	<title>
	What parish? | Diocese of Salford Parish Boundaries
	</title>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col"><img src="../assets/dioc_banner.jpg" class="mx-auto d-block logo" alt="Diocese of Salford" /></div>
        </div>

        <!-- Navigation -->
        <div class="row">
            <div class="col">
                <div class="menu-button">Menu</div>
                <nav>
                    <ul data-breakpoint="1080" class="flexnav">
                        <li><a href="../">Home</a></li>
                        <li><a href="deaneries">Deaneries</a></li>
                        <li><a href="map">Interactive map</a></li>
                        <li><a href="what-parish">What parish?</a></li>
                        <li><a href="contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>

<div class="row mt-5 body-height">

		<div class="d-none d-md-block col-1">&nbsp;</div>

		<div class="col-12 col-md-6">

			<h2 class="fw-bold">What parish am I in?</h2>
			<p>To find out which parish you are in, please enter your postcode below.</p>

			<form id="postcodeForm" class="postcode-form" novalidate>
				<label class="visually-hidden" for="postcode">Postcode</label>
				<input
					type="text"
					id="postcode"
					name="postcode"
					class="form-control border border-primary p-3"
					placeholder="Postcode"
					autocomplete="postal-code"
					autocapitalize="characters"
					spellcheck="false"
				/>
				<button class="btn btn-primary p-3" type="submit">Search</button>
			</form>

			<div id="result" class="lookup-panel" hidden></div>
		</div>

		<div class="d-none d-md-block col-1">&nbsp;</div>

		</div> <!-- Footer -->
        <div class="footer">
            <p>Copyright &copy; Diocesan Boundaries Board (Diocese of Salford) 2026.</p>
        </div>

    </div>

    <script src="../js/data.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/boundaries.js"></script>
    <script src="../js/what-parish.js"></script>

</body>
</html>
