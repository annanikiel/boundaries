<!DOCTYPE html>
<html>
<head>
    <!-- Meta tags -->
	<meta charset="utf-8" />
	<meta name="Description" content="Collection of maps showing current and proposed parish boundaries in the Diocese of Salford." />
	<meta name="Keywords" content="Diocese of Salford, parish boundaries, parishes, location of catholic churches, catholic churches, location of catholic schools, catholic schools" />
	    
	<!-- Apple users -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes" />
	
	<!-- Shortcut & address bar icon -->
	<link href="../assets/favicon.png" rel="icon" type="image/png" />
	
	<!-- Stylesheet files -->
	<link href="../css/style.css" rel="stylesheet" media="screen" />
	<link href="../css/flexnav.css" rel="stylesheet" media="screen" />
		
	<!-- Fonts -->
	<link href="https://fonts.googleapis.com/css?family=Merienda|Arimo" rel="stylesheet">

	
	
	<!-- Page title -->
	<title> 
	Parishes | Diocese of Salford Parish Boundaries
	</title>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col"><img src="../assets/dioc_banner.jpg" class="mx-auto d-block logo" /></div>
        </div>


        <!-- Navigation -->
        <div class="row">
            <div class="col">
                <div class="menu-button">Menu</div>
                <nav>
                    <ul data-breakpoint="1080" class="flexnav">
                        <li><a href="../">Home</a></li>
                        <li><a href="deaneries">Deaneries</a></li>
                        <li><a href="map">Interactive map</a></li>
                        <li><a href="what-parish">What parish?</a></li>
                        <li><a href="contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </div>
<div class="row mt-5 body-height">
		
		<div class="d-none d-md-block col-1">&nbsp;</div>
					
		<div class="col-12 col-md-6">

			<h2 class="fw-bold">Parishes</h2>
			
			
<p class="lead pb-5"><span class="fw-bold">Deanery: </span><span id="deaneryName">name</span></p>
    <div class="pb-5">
		<h3>Current parishes</h3>
		<p><span class="fw-bold">Total: </span><span id="currentCount" class="count"></span></p>
		<p class="lh-lg">
            <ul id="currentList" class="parish-list"></ul>
        </p>
   </div>

     <div class="pb-5">
		<h3>Proposed amalgamations</h3>
		<p><span class="fw-bold">Total: </span><span id="proposedCount" class="count"></span></p>
		<p class="lh-lg"> 
            <ul id="proposedList" class="parish-list"></ul>
        </p>
   </div>
    
     <div class="pb-5">
		<h3>Archive</h3>
		<p><span class="fw-bold">Total: </span><span id="closedCount" class="count"></span></p>
        <ul id="closedList" class="parish-list"></ul>
		<p class="lh-lg"> 
        </p>
   </div>
    </div>
		
		<div class="col-12 col-md-4">
            
            <figure class="deanery-map">
                <img
                    id="deaneryMapImg"
                    src=""
                    alt=""
                    loading="lazy"
                    style="width:75%;" 
                    class="rounded mx-auto d-block"
                />
                <figcaption id="deaneryMapCaption" class="sr-only"></figcaption>
            </figure>
            
            </div>
		<div class="d-none d-md-block col-1">&nbsp;</div>

		</div> <!-- Footer -->
        <div class="footer">
            <p>Copyright © Diocesan Boundaries Board (Diocese of Salford) 2026.</p>
        </div>


    </div>


  <script src="../js/data.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function parishLink(p) {
    return `<li><a href="parish?id=${encodeURIComponent(p.id)}">${p.name}</a></li>`;
  }

  (async function () {
    const deaneryId = qs("id");
    const [deaneries, statuses, parishIndex] = await Promise.all([
      loadDeaneries(),
      loadStatuses(),
      loadParishIndex()
    ]);

    const d = deaneries.find(x => x.id === deaneryId);
    document.title = d ? d.name : "Deanery";
    document.getElementById("deaneryName").textContent = d ? d.name : "Deanery";

    // Deanery map image placeholder
    const img = document.getElementById("deaneryMapImg");
    const caption = document.getElementById("deaneryMapCaption");

    if (d?.mapImage) {
      img.src = dataURL(d.mapImage);
      img.alt = d.mapAlt || `${d.name} highlighted on the diocesan map`;
    } else {
      // No map for this deanery: hide the figure rather than show a broken image.
      img.closest("figure").hidden = true;
    }

    if (caption) caption.textContent = img.alt;

    // Parishes
    const parishes = parishIndex.filter(p => p.deaneryId === deaneryId);

    const current = parishes.filter(p => p.status === "current");
    const proposed = parishes.filter(p => p.status === "proposed");
    const closed = parishes.filter(p => p.status === "closed");

    document.getElementById("currentCount").textContent =
    `(${current.length})`;

    document.getElementById("proposedCount").textContent =
    `(${proposed.length})`;

    document.getElementById("closedCount").textContent =
    `(${closed.length})`;

    document.getElementById("currentList").innerHTML = current.map(parishLink).join("") || "<li>None</li>";
    document.getElementById("proposedList").innerHTML = proposed.map(parishLink).join("") || "<li>None</li>";
    document.getElementById("closedList").innerHTML = closed.map(parishLink).join("") || "<li>None</li>";
  })().catch(err => {
    console.error(err);
    document.getElementById("currentList").innerHTML = "<li>Failed to load parishes.</li>";
  });
  </script>


</body>
</html>
